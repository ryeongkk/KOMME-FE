language: "ko-KR"
reviews:
  profile: "chill"
  auto_review:
    enabled: true
  path_instructions:
    - path: "src/app/globals.css"
      instructions: >
        디자인 토큰(색상, 타이포그래피)은 Figma에서 추출한 값입니다. 임의로
        지어낸 색상/수치로 보이면 지적해 주세요.
    - path: "**/*.tsx"
      instructions: >
        Tailwind v4 CSS-first 설정을 사용합니다. tailwind.config.js 기반 문법
        제안은 하지 마세요.
    - path: "**/*.{ts,tsx}"
      instructions: >
        `// ponytail:` 주석이 붙은 코드는 백엔드 API가 아직 없어 의도적으로 넣어둔
        정적 스텁/목 데이터입니다. 그 안의 날짜가 현재 시점 기준 과거/미래인지,
        값이 비현실적인지, 하드코딩됐는지 같은 지적은 하지 마세요 — 실제 API가
        생기면 교체될 자리라는 걸 주석이 이미 밝히고 있습니다. 그 스텁을 소비하는
        쪽의 실제 로직 버그(타입 오류, 조건 오류, null 처리 누락 등)는 계속
        지적해 주세요.
chat:
  auto_reply: true
